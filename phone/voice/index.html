<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素语音</title><link rel="stylesheet" href="/voice.css"><script src="/voice.js" defer></script></head>
<body><header>feiyu@voice <span>◼</span></header>
<main><p class="eyebrow">MIDNIGHT / VOICE</p><h1>语音终端<span>▂ ▄ ▆</span></h1>

<div class="controls"><button id="start">开始对话 ▸</button><button id="standby">后台待机 ◇</button><button id="stop" disabled>结束 ■</button></div>
